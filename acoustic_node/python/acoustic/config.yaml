# Acoustic capture configuration.
# All tunables live here so the code never hardcodes device/threshold values
# (see CLAUDE-COMMON.md: never hardcode hardware addresses/params in driver files).

audio:
  # null = use the system default input device.
  # Set to an integer device index or an exact device name string to override
  # (run `python -m acoustic.live_monitor --list-devices` to see options).
  device: null
  sample_rate: 44100
  channels: 1
  # Analysis block size fed into the RMS trigger check. Smaller = faster
  # trigger response but noisier RMS estimate.
  block_size_ms: 30

trigger:
  # "rms"       - trigger on the mic's own RMS crossing (acoustic.capture.TriggerDetector).
  #               Dev-machine default: works with just a laptop mic, no ToF/solenoid hardware.
  # "hardware"  - trigger on a real tap event notified via AudioCapture.notify_tap()
  #               (acoustic.hardware_trigger.HardwareTapDetector), driven by
  #               a bridge on the Pi (acoustic/tap_bridge.py: the Nano's serial
  #               TAP lines) calling station/tap -> notify_tap(). Requires the real ToF +
  #               dual-solenoid station (see
  #               documents/electrical/schematics/acoustic_station_wiring.md).
  # "simulated" - same HardwareTapDetector, but acoustic.live_monitor drives the taps
  #               itself using tap_mechanism below + a fake periodic tile arrival
  #               (no hardware needed at all) — see live_monitor.py --simulate-taps.
  mode: rms

  # Linear RMS threshold, range 0.0-1.0 (float32 samples). Not dBFS.
  # This is a throwaway starting value for a laptop mic with unknown gain —
  # run --calibrate first and watch the printed RMS levels to pick a real one.
  # Only used when mode: "rms".
  rms_threshold: 0.02
  # How much audio before the threshold crossing to keep, so the captured
  # clip includes the attack transient and not just the tail.
  pre_trigger_ms: 200
  # Total length of the captured clip, including the pre-trigger portion.
  capture_duration_s: 1.5
  # Minimum time after a capture starts before a new trigger is allowed.
  # Prevents one sound event from being re-captured multiple times as its
  # decay tail crosses the threshold repeatedly.
  cooldown_s: 1.0

hardware_trigger:
  # Used when trigger.mode is "hardware" or "simulated". Same shape as
  # trigger's rms fields, but the capture window starts from an external tap
  # event (acoustic.hardware_trigger.HardwareTapDetector) instead of an RMS
  # threshold crossing. Defaults follow Acoustic_Sorting_Subsystem.md §4.1/§8.1's
  # recommended -100ms pre-hit noise window and 0.5s total clip.
  pre_trigger_ms: 100
  capture_duration_s: 0.5
  cooldown_s: 1.0
  # mode: "simulated" only — live_monitor.py fakes a tile arriving this often,
  # staying "present" for simulated_tile_present_s (must exceed the
  # tap_mechanism sequence duration below, or a tap never fires).
  simulated_tile_interval_s: 4.0
  simulated_tile_present_s: 2.0

# Dev-machine mirror of acoustic_node/sketch/sketch.ino's tap-sequencer timing
# constants — used only by acoustic.tap_sequencer.TapSequencer when simulating
# tap events on a machine with no ToF sensor/solenoids attached (trigger.mode:
# "simulated"). The sketch is the source of truth for real hardware timing;
# these are NOT read by the sketch and must be kept in sync by hand. See
# documents/electrical/schematics/acoustic_station_wiring.md §5.
tap_mechanism:
  settle_s: 0.2       # wait after tile detected, before arming
  arm_s: 0.3           # ARM solenoid energized: drives striker/ball to drop height
  arm_settle_s: 0.15   # wait after arm retracts, before releasing
  lock_pulse_s: 0.1    # LOCK solenoid energized: latch open, ball free-falls onto tile
  cooldown_s: 1.0       # minimum time before the next tile can arm a new cycle

# ---------------------------------------------------------------------------
# Station block: the Pi's tile-decision service (acoustic.live_station).
# Read by acoustic/station.py and fusion/*. The older live_monitor tool ignores
# it. Design and message contract: documents/programming/station_coordination.md
# ---------------------------------------------------------------------------
station:
  # The broker runs ON THE PI, so the line never depends on the master PC.
  # The master (optional) connects to this same broker to observe and command.
  mqtt:
    enabled: true
    host: "127.0.0.1"
    port: 1883
    client_id: "tile-acoustic"

  # Every tile, both stations' results, the final grade and its delivery state.
  # Relative to the repo root; data/ is gitignored.
  store:
    path: "data/station/tiles.db"
    # Evidence kept per tile: the camera picture, the tap recording (WAV) and a
    # small spectrum preview. When the files exceed the budget the OLDEST are
    # deleted first (the database rows and history are kept forever).
    blob_dir: "data/station/blobs"
    blob_budget_gb: 20
    keep_audio: true

  # The master PC pulls this record from the GUI port (read-only, /api/sync/*).
  # Set a token and the master must send it as X-Sync-Token (the GUI is served on
  # 0.0.0.0, so with null anyone on the LAN can read the record).
  sync:
    token: null

  ledger:
    # A tile that has not been tapped this long after the camera graded it is
    # sent as Hold (or Reject if the camera already rejected it) — never guessed.
    # Must exceed the belt's real camera->tap transit time. UNMEASURED: belt
    # speed is open-loop. 30 s is a deliberately generous placeholder.
    max_wait_s: 30.0
    # A tile younger than this cannot have reached the tap station yet, so a
    # sound heard sooner is not attributed to it. 0 = no such rule.
    min_transit_s: 0.0

  final:
    # OFF until sound has been validated on real good/defective tiles: the
    # tap result is recorded and shown, but never changes a grade.
    vote_enabled: false
    # A sound grade only counts at or above this confidence.
    min_confidence: 0.6
    # grade -> destination reported to the UNO Q. Names are free text.
    bins:
      "Grade A": "bin_1"
      "Grade B": "bin_2"
      "Grade C": "bin_3"
      "Reject": "bin_4"
      "Hold": "manual"
    # A Hold tile is a person's job: it is NOT sent to the UNO Q (the gantry has no `manual`
    # location, and it picks whatever is at the pickup point, so a tile it does not know about
    # would be picked into the NEXT tile's bin). The Pi marks it `needs_person`, raises one
    # sticky alert, and publishes tile/<id>/needs_person for the master.
    hold_to_gantry: false
    # While a Hold tile is on its way to the pickup the feed is paused, so the gantry cannot
    # take it by mistake. A person takes it off the belt and presses Resume feed (starting the
    # line does NOT confirm it - only Resume feed does). false = keep
    # feeding (only safe if something else keeps Hold tiles away from the pickup point).
    hold_pauses_feed: true

  unoq:
    # The UNO Q answers every final with tile/<id>/ack. With require_ack true
    # (production) finals go out one at a time, in order, and are resent until
    # acknowledged; with false (bench, no UNO Q yet) they are fire-and-forget.
    require_ack: true
    ack_timeout_s: 2.0
    retries: 3            # unanswered attempts before the link is declared DOWN
    max_outbox: 50

  health:
    camera_stale_s: 6.0   # camera heartbeat older than this = camera FAILED
    clock_warn_s: 1.0     # a peer's clock differing from the Pi's by more than this = WARNING
                          # on the service view (never a fault: nothing is decided from
                          # cross-node time). Fix by syncing the peer to the Pi (network_plan.md §6).

  heartbeat_s: 2.0

  # Data-collection sessions ("the bag"): the Service view's Session panel records ONE run into
  # data/sessions/<date_time>/ -- the continuous microphone, the camera's raw video, every bus
  # message with a timestamp, the labelled retract/strike events and a labelled WAV clip of each.
  # Layout and rules: fusion/session.py. Nothing is recorded unless someone presses Start.
  session:
    enabled: true
    root: "data/sessions"      # relative to the repo root; gitignored with data/
    chunk_s: 30                # the microphone is written in files this long (a crash loses one)
    min_free_gb: 2             # a session will not start with less free disk than this
    stop_free_gb: 0.5          # below this the Service view shows LOW DISK (it does not stop by itself)
    clip_pre_s: 0.3            # each event's clip: this much before it ...
    clip_post_s: 1.2           # ... and this much after (the decay of a tile can be long)

  # The striker RESTS DOWN (the coil overheated when it was held up all the time). When the camera grades a
  # live tile this station sends the Nano `UP`; the Nano raises the striker, waits for the ToF to see the tile,
  # strikes 2 s later and lowers itself when nothing more is coming. Needs the request-only firmware
  # (nano_core.h prototypeConfig); on older firmware the Nano answers ERR UNSUPPORTED to every UP.
  striker:
    arm_on_camera: true

  # The Arduino Nano (striker + belt PWM) on USB serial, through
  # acoustic/tap_bridge.py. Protocol: documents/programming/nano_serial_protocol.md.
  # Off until the Nano exists: taps then come from the rms trigger or the
  # service view's Simulate tap button.
  nano:
    enabled: false
    # Pin by id, not ttyUSB0/1: /dev/serial/by-id/usb-... survives re-plugging.
    port: "/dev/ttyUSB0"
    baud: 115200
    # true once wired: a silent Nano is then a FAULT (taps would be lost).
    required: false
    stale_s: 3.0        # no valid line from the Nano for this long = link down
    ping_s: 0.5         # keep-alive to the Nano; ITS watchdog stops the belt without it
    # After a watchdog trip the Nano needs a fresh BELT + STRIKE 1 (nothing restarts by
    # itself). true = re-send the last ones this bridge was told to send once the Nano
    # reports the Pi is back. Off by default: it can restart a belt someone stopped on
    # purpose. Otherwise run system.sh start (or publish station/belt + station/strike).
    resend_on_recover: false
  # Allow the master to send station/cmd (vote, hold_all, clear_alarms).
  commands_enabled: true

  analysis:
    # What counts as a real strike rather than silence/noise. Provisional.
    min_peak: 0.02        # linear amplitude (0-1)
    min_snr_db: 20.0      # peak over the pre-trigger noise
    min_freq_hz: 100.0
    max_freq_hz: 12000.0

  # Rule-based sound grade. null = the sound result has no grade (abstains)
  # until a reference is derived from REAL good and defective tiles, e.g.:
  #   reference: {peak_hz_min: 2500, peak_hz_max: 3100, max_decay_t20_s: 0.12, rule_confidence: 0.7}
  reference: null

  dashboard:
    host: "0.0.0.0"
    port: 5001            # network_plan.md §3.1 (camera is 5000)
    # Production: false. The run view is read-only; the service view's switches
    # (sound vote, hold-all, microphone choice, simulate tap) need this on.
    controls_enabled: false
