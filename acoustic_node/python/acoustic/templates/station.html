<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Station</title>
<style>
  :root {
    --bg:#0e1116; --panel:#171c24; --line:#2a313c; --text:#e8ecf1; --muted:#8b95a3;
    --a:#2fbf71; --b:#e3b341; --c:#f0883e; --rej:#f85149; --hold:#a371f7;
    --ok:#2fbf71; --warn:#e3b341; --fail:#f85149;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:grid; grid-template-rows:auto auto 1fr auto; gap:12px; padding:12px 16px; min-height:100vh; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:.02em; }
  .spacer { flex:1; }
  .clock { color:var(--muted); font-variant-numeric:tabular-nums; }
  .state { padding:8px 20px; border-radius:999px; font-weight:700; font-size:20px; letter-spacing:.04em;
    background:var(--panel); border:2px solid var(--line); text-transform:uppercase; }
  .state.waiting { color:var(--muted); }
  .state.awaiting_tap { color:var(--b); border-color:var(--b); }
  .state.sent { color:var(--ok); border-color:var(--ok); }
  .state.hold_all { color:var(--hold); border-color:var(--hold); }
  .state.fault { color:#fff; background:var(--fail); border-color:var(--fail); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.65; } }
  .health { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  .chip { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--muted);
    border-radius:8px; padding:8px 12px; min-width:0; }
  .chip.ok { border-left-color:var(--ok); } .chip.warn { border-left-color:var(--warn); }
  .chip.fail { border-left-color:var(--fail); background:#2a1517; }
  .chip b { display:block; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .chip span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:12px; min-height:0; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .last { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,220px); gap:16px; }
  @media (max-width:600px) { .last { grid-template-columns:1fr; } }
  .grade { font-size:clamp(40px,8vw,88px); font-weight:800; line-height:1.05; }
  .dest { font-size:clamp(20px,3vw,32px); margin-top:6px; }
  .tid { color:var(--muted); font-variant-numeric:tabular-nums; margin-top:4px; }
  .g-Grade-A { color:var(--a); } .g-Grade-B { color:var(--b); } .g-Grade-C { color:var(--c); }
  .g-Reject { color:var(--rej); } .g-Hold { color:var(--hold); }
  .reasons { margin:12px 0 0; padding-left:18px; color:var(--muted); }
  .tileimg { width:100%; aspect-ratio:1; object-fit:contain; background:#000; border-radius:8px; border:1px solid var(--line); }
  .noimg { display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .counts { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; text-align:center; }
  .counts div { background:#0e1116; border-radius:8px; padding:8px 4px; }
  .counts .n { font-size:clamp(22px,3vw,36px); font-weight:800; font-variant-numeric:tabular-nums; }
  .counts .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .await { margin-top:14px; }
  .await .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  footer { display:grid; gap:10px; }
  .alarms { display:none; background:#3a1518; border:2px solid var(--fail); border-radius:10px; padding:10px 14px; }
  .alarms.show { display:block; }
  .alarms .top { display:flex; align-items:center; gap:12px; }
  .alarms button { margin-left:auto; font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--fail);
    background:transparent; color:var(--text); cursor:pointer; }
  .alarms ul { margin:6px 0 0; padding-left:18px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .tablewrap { overflow-x:auto; }
  #stale { display:none; position:fixed; inset:0; background:rgba(120,0,0,.88); z-index:10;
    align-items:center; justify-content:center; text-align:center; font-size:clamp(24px,5vw,56px); font-weight:800; padding:24px; }
  body.stale #stale { display:flex; }
  a { color:var(--muted); }
</style>
</head>
<body>
<div id="stale">NO DATA FROM THE STATION<br><small style="font-size:.4em;font-weight:400">The display lost contact. Do not trust what was shown before this.</small></div>

<header>
  <h1>Tile station</h1>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <span class="state waiting" id="state">…</span>
</header>

<section class="health" id="health"></section>

<main>
  <section class="card">
    <h2>Last tile</h2>
    <div class="last">
      <div>
        <div class="grade" id="lastGrade">—</div>
        <div class="dest" id="lastDest"></div>
        <div class="tid" id="lastTid"></div>
        <ul class="reasons" id="lastReasons"></ul>
      </div>
      <div id="lastImgBox" class="tileimg noimg">no picture</div>
    </div>
  </section>
  <section class="card">
    <h2>Since start-up</h2>
    <div class="counts" id="counts"></div>
    <div class="await">
      <h2 style="margin-top:14px">Waiting for a tap</h2>
      <div id="awaiting" style="color:var(--muted)">none</div>
    </div>
  </section>
</main>

<footer>
  <div class="alarms" id="alarms">
    <div class="top"><strong>ALARM</strong><span id="alarmCount"></span>
      <button id="ack">Acknowledge</button></div>
    <ul id="alarmList"></ul>
  </div>
  <section class="card" style="padding:10px 12px">
    <div class="tablewrap">
      <table>
        <thead><tr><th>Time</th><th>Tile</th><th>Camera</th><th>Sound</th><th>Final</th><th>Bin</th><th>UNO Q</th></tr></thead>
        <tbody id="recent"></tbody>
      </table>
    </div>
    <div style="margin-top:6px;font-size:13px"><a href="/service">Service view</a></div>
  </section>
</footer>

<script>
const GRADES = ["Grade A","Grade B","Grade C","Reject","Hold"];
const SHORT = {"Grade A":"A","Grade B":"B","Grade C":"C","Reject":"Reject","Hold":"Hold"};
const gcls = g => "g-" + String(g || "").replace(/\s+/g, "-");
const $ = id => document.getElementById(id);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleTimeString() : ""; }

let lastOk = Date.now();
let lastShownTile = null;

function renderHealth(health) {
  const box = $("health"); box.replaceChildren();
  const names = {broker:"Broker", camera:"Camera", mic:"Microphone", nano:"Striker (Nano)", unoq:"UNO Q link"};
  for (const k of ["camera","mic","nano","broker","unoq"]) {
    const v = health[k]; if (!v) continue;
    const c = h("div", "chip " + v.level);
    c.appendChild(h("b", null, names[k]));
    const s = h("span", null, v.detail || v.level); s.title = v.detail || "";
    c.appendChild(s); box.appendChild(c);
  }
}

function renderLast(st, recent) {
  const lf = st.last_final;
  const row = lf ? recent.find(r => r.tile_id === lf.tile_id) : null;
  if (!lf) return;
  $("lastGrade").textContent = lf.grade;
  $("lastGrade").className = "grade " + gcls(lf.grade);
  $("lastDest").textContent = "→ " + lf.destination;
  $("lastTid").textContent = lf.tile_id + "  ·  " + fmtTime(lf.ts);
  const ul = $("lastReasons"); ul.replaceChildren();
  if (row && row.reasons) for (const r of row.reasons) ul.appendChild(h("li", null, r));
  if (lastShownTile !== lf.tile_id) {
    lastShownTile = lf.tile_id;
    const box = $("lastImgBox");
    const img = new Image();
    img.className = "tileimg";
    img.alt = "the tile that was graded";
    img.onload = () => box.replaceWith(Object.assign(img, {id: "lastImgBox"}));
    img.onerror = () => { box.className = "tileimg noimg"; box.textContent = "no picture"; };
    img.src = "/tile_image/" + encodeURIComponent(lf.tile_id);
  }
}

function renderCounts(tally) {
  const box = $("counts"); box.replaceChildren();
  for (const g of GRADES) {
    const d = h("div"); d.appendChild(h("div", "n " + gcls(g), String(tally[g] || 0)));
    d.appendChild(h("div", "l", SHORT[g])); box.appendChild(d);
  }
}

function renderAwaiting(list) {
  const box = $("awaiting"); box.replaceChildren();
  if (!list.length) { box.textContent = "none"; return; }
  for (const t of list) {
    const r = h("div", "row");
    r.appendChild(h("span", null, t.tile_id));
    r.appendChild(h("span", gcls(t.camera_grade), t.camera_grade || "?"));
    r.appendChild(h("span", null, t.age_s + " s"));
    box.appendChild(r);
  }
}

function renderAlarms(alarms) {
  const live = alarms.filter(a => a.level === "alarm");
  $("alarms").classList.toggle("show", live.length > 0);
  $("alarmCount").textContent = live.length > 1 ? "(" + live.length + ")" : "";
  const ul = $("alarmList"); ul.replaceChildren();
  for (const a of live.slice(0, 4)) ul.appendChild(h("li", null, fmtTime(a.ts) + "  " + a.message));
}

function renderRecent(rows) {
  const tb = $("recent"); tb.replaceChildren();
  for (const r of rows.slice(0, 8)) {
    const tr = h("tr");
    tr.appendChild(h("td", null, fmtTime(r.created_ts)));
    tr.appendChild(h("td", null, r.tile_id));
    tr.appendChild(h("td", gcls(r.camera_grade), r.camera_grade || "—"));
    const snd = r.acoustic_grade ? r.acoustic_grade + (r.acoustic_counted ? "" : " (not counted)") : (r.state === "final" ? "—" : "waiting");
    tr.appendChild(h("td", null, snd));
    tr.appendChild(h("td", gcls(r.final_grade), r.final_grade || "…"));
    tr.appendChild(h("td", null, r.destination || ""));
    tr.appendChild(h("td", null, r.delivery || ""));
    tb.appendChild(tr);
  }
}

async function poll() {
  try {
    const res = await fetch("/api/station", {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    const st = await res.json();
    lastOk = Date.now();
    const s = $("state");
    s.className = "state " + st.state;
    s.textContent = st.state.replace("_", " ");
    s.title = st.state_detail || "";
    renderHealth(st.health);
    renderLast(st, st.recent);
    renderCounts(st.tally);
    renderAwaiting(st.awaiting);
    renderAlarms(st.alarms);
    renderRecent(st.recent);
  } catch (e) { /* the staleness timer below reports it */ }
}

setInterval(poll, 500);
setInterval(() => {
  $("clock").textContent = new Date().toLocaleString();
  document.body.classList.toggle("stale", Date.now() - lastOk > 3000);
}, 500);
$("ack").addEventListener("click", () =>
  fetch("/api/control/clear_alarms", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}));
poll();
</script>
</body>
</html>
