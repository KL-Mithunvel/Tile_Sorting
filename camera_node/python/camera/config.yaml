# Camera vision pipeline configuration.
# All tunables live here so the code never hardcodes device/threshold values
# (see .CLAUDE/CLAUDE.md Development Rule 2 / CLAUDE-COMMON.md).
#
# CALIBRATED (2026-08-11) against 311 real terracotta tile photos in data/
# (see development/analyze_dataset.py, development/README.md) — segmentation
# hsv_lower/upper, crack_detection canny_low/high/border_margin_px, and
# corner_detection.min_fill_ratio below are data-driven, not hand guesses,
# BUT: (1) every photo used was a close-up calibration shot of a known-INTACT
# tile on a checkerboard sheet, at a much higher resolution than the live
# 640x480 pipeline — this only established a false-positive FLOOR (thresholds
# loose enough not to flag known-good tiles), not true-positive sensitivity
# to real cracks/broken corners, since no damaged-tile photos exist yet; and
# (2) min_tile_area_px and border_margin_px are absolute pixel counts tied to
# the resolution/framing they were measured at — re-derive both once the
# conveyor-mounted camera's real distance/resolution is fixed (still
# undecided — see .CLAUDE/CLAUDE.md Known Technical Debt). Re-run
# development/analyze_dataset.py against real damaged-tile photos as soon as
# any exist.
#
# corner_detection also gained max_missing_extent_fraction + tile_size_inches
# the same day, after fill_ratio alone was found to under-catch diagonal
# corner chips — see corner_detection.py's docstring and the comment on
# max_missing_extent_fraction below.

camera:
  # Which capture backend to open (see camera/capture.py create_capture()):
  #   "auto"       - use the CSI camera if libcamera actually reports one,
  #                  otherwise fall back to a USB webcam. Lets the same config
  #                  file work unchanged on the Windows dev laptop and on the
  #                  Raspberry Pi 5 station.
  #   "usb"        - force WebcamCapture (OpenCV VideoCapture).
  #   "picamera2"  - force PiCameraCapture (Raspberry Pi CSI module).
  # Target hardware is a Raspberry Pi 5 / Raspberry Pi OS Desktop 64-bit
  # (decided 2026-09-20, Automation_Architecture.md 5.2) - NOT an Arduino UNO Q.
  backend: "auto"

  # --- USB / UVC webcam settings (backend "usb", or "auto" with no CSI cam) ---
  # OpenCV VideoCapture device index. 0 = first/default webcam.
  # Re-verify per machine with: python -m camera.live_dashboard --list-devices
  device_index: 0
  # OpenCV capture API. "any" is right on Windows. On the Pi, pin "v4l2" -
  # OpenCV can otherwise pick a GStreamer path that silently ignores the
  # resolution/FPS requests below.
  api_preference: "any"

  # Capture format (changed 2026-10-11: was 640x480 @ 15). MEASURED on the laptop
  # webcam: it delivers ~30 fps at 640x480, 1280x720 AND 1920x1080, so the old
  # setting threw away 4-9x the pixels and half the frame rate. 1920x1080 is also
  # what the validated recordings in data/videos/ are, and several absolute-pixel
  # thresholds below (min_tile_area_px, border_margin_px...) were checked at it.
  # Many webcams only reach 30 fps at high resolution in a compressed format, so
  # ask for MJPG; a camera that cannot do it ignores the request. After start() the
  # driver's ACTUAL values are shown on the dashboard - asking is not getting.
  frame_width: 1920
  frame_height: 1080
  target_fps: 30
  fourcc: "MJPG"        # null = leave it to the driver
  # Frames the driver may queue. 1 = always the newest; a deep queue makes every
  # frame old by the time it is read (and looks like lag).
  buffer_size: 1
  # null = leave the camera's own value. Many webcams reject it (the laptop's does).
  gain: null
  # Exposure is the main cause of motion blur: a tile moving 14 px/frame (435 px/s
  # at 30 fps on a 1080-px frame) smears by speed x exposure time, ~7 px at the
  # webcam's auto 1/64 s. "manual" fixes the shutter so it cannot drift per tile -
  # but a faster shutter needs MORE LIGHT on the belt: on the laptop webcam,
  # manual 1/128 s gave a nearly black image (brightness 26/255) in normal room
  # light, and this webcam cannot raise gain to compensate. Brighten the belt first.
  #   mode: "auto" | "manual"
  #   value: manual only, passed to the driver as-is. DirectShow (Windows): log2
  #          seconds, -6 = 1/64 s, -7 = 1/128 s, -8 = 1/256 s. V4L2 (Pi/Linux):
  #          units of 100 microseconds. Needs api_preference "dshow" or "v4l2".
  exposure:
    mode: "auto"
    value: -7

  # --- CSI Raspberry Pi camera module settings (backend "picamera2"/"auto") ---
  # UNVERIFIED: no CSI module has been attached yet, so nothing in this block
  # has ever run. See camera_node/README.md.
  picamera2:
    camera_num: 0
    # libcamera names formats by packing order, not channel order, so
    # "RGB888" already hands back B,G,R - exactly what OpenCV wants, no
    # conversion. If colours look inverted on the bench, set swap_rb: true
    # rather than editing capture.py; a wrong channel order would silently
    # wreck the HSV segmentation range below.
    format: "RGB888"
    swap_rb: false
    # Passed straight through to libcamera. LEAVE EMPTY UNTIL THE RIG'S
    # LIGHTING IS FIXED, then lock exposure/gain/white-balance here: with
    # auto-exposure and AWB on, the sensor re-exposes per tile and the
    # calibrated hsv_lower/hsv_upper below stop meaning anything.
    # Example once the enclosure lighting is final:
    #   controls:
    #     AeEnable: false
    #     AwbEnable: false
    #     ExposureTime: 8000        # microseconds
    #     AnalogueGain: 1.0
    #     ColourGains: [1.8, 1.6]   # [red, blue]
    controls: {}

segmentation:
  # HSV range for isolating a brown terracotta tile from its background.
  # OpenCV hue range is 0-179. Derived from the 0.5/99.5 percentile of
  # center-crop pixels across 311 real tile photos (hue computed only from
  # well-lit pixels — it's unstable/near-random on the near-gray glare and
  # shadow pixels every photo also has — see analyze_dataset.py), plus a
  # safety margin.
  #
  # Hue floor lowered 6 -> 3 on 2026-10-11 (upper bound and the rest unchanged). In
  # the laptop-webcam recordings a lighting/white-balance gradient shifts part of a
  # tile toward red (measured on one intact tile: the lost region was hue 0-3, same
  # brightness), those pixels fell out of the mask, the outline looked "broken"
  # (corner fill 0.60) and a GOOD tile was rejected. Over all 92 graded frames from 5
  # videos: floor 3 cuts corner-broken flags from 13 to 10 with no new false flags;
  # going to 0 or wrapping past 179 starts flagging one lab-clip tile. Re-check
  # against real rig photos - the original range came from 311 photos with a 6 floor.
  hsv_lower: [3, 0, 37]
  hsv_upper: [15, 208, 225]
  # Minimum contour area (pixels) to be considered a tile rather than noise.
  # NOT re-derived from the photo dataset (see note above) — still the
  # original placeholder.
  min_tile_area_px: 3000
  # Morphological close/open kernel size, to clean up the threshold mask.
  morph_kernel_size: 5
  # Shape gate (added 2026-10-09): colour alone cannot tell a tile from a brown
  # sandal or the dark wood rim beside the belt, so a colour-matched blob must
  # also be tile-SHAPED. Measured on the real belt clip: tiles fill 0.93-0.96 of
  # their rotated bounding rectangle with aspect 1.00-1.02; the sandal/rim blob
  # filled 0.28 with aspect 0.23. Kept deliberately looser than
  # corner_detection.min_fill_ratio so a chipped tile is still segmented and
  # then flagged by the corner check rather than silently dropped here.
  # Widen the aspect range for non-square tiles. null disables a check.
  min_fill_ratio: 0.6
  min_aspect: 0.5
  max_aspect: 2.0
  # Belt region of interest (added 2026-10-09). The camera looks straight down
  # at the conveyor, so a tile can only be on the belt; everything else (wooden
  # bench, rails, a person's feet) is excluded BEFORE colour matching. On the
  # real clip the bench and a sandal both matched the tile hue.
  #   mode "off"   - search the whole frame (bench tests with no belt in view).
  #   mode "fixed" - a normalised rect [x0, y0, x1, y1]; right for the bolted-down
  #                  rig where the belt never moves in frame.
  #   mode "color" - find the belt by its own hue each frame; survives a hand-held
  #                  camera. If the belt is NOT visible this frame, NO tile is
  #                  seen (it does not fall back to the whole frame) - so with a
  #                  wrong belt colour the station sees nothing, loudly, rather
  #                  than grading the bench.
  belt_roi:
    mode: "color"
    rect: [0.0, 0.0, 1.0, 1.0]       # used by mode "fixed"
    # The lab conveyor's mat. It reads GREEN (hue ~60-75) in the phone clip but TEAL
    # (hue ~86-93) in the laptop-webcam recordings, so the range runs from green to
    # cyan. Measured over 24 frames of each of 5 videos: an upper bound of 85 finds
    # the belt in only 3/24 frames of two of them; 95 finds it in 24/24 of all; from
    # 100 up other colours (dark jeans, bluish shadows) leak in and the belt's
    # direction becomes unreliable. Re-measure if the belt, light or camera change.
    hsv_lower: [45, 60, 40]
    hsv_upper: [95, 255, 255]
    margin_px: 25                    # a tile can overhang the belt edge
    min_area_px: 2000                # ignore specks of belt colour

crack_detection:
  blur_kernel_size: 5
  # Canny edge detector thresholds. Chosen from a grid search (30-200) as the
  # pair with the lowest false-positive rate on known-intact tile photos.
  canny_low: 75
  canny_high: 200
  # Blanks a border band of the Canny edge map before contour-matching.
  # Without this, the tile's own silhouette edge — which sits right at the
  # crop's border, since crack_detection runs on segmentation's tight
  # bounding-box crop — reads as a long, thin, high-contrast line and gets
  # misdetected as a crack on nearly every photo (measured: ~98% false-positive
  # rate at margin=0, dropping to ~2% at margin=40 on the calibration set).
  # 25 is a middle-ground default, not the calibration set's lowest-FP value
  # (40px, but that was measured on ~700-1000px-wide crops from close-up
  # photos) — see the resolution-transfer caveat above.
  border_margin_px: 25
  # A candidate edge contour must be at least this long (pixels, arc length)
  # and this elongated (major/minor axis ratio) to count as a crack rather
  # than surface texture noise. Not part of the grid search above — still
  # the original placeholder.
  min_crack_length_px: 40
  min_aspect_ratio: 4.0
  # Below this measured length, a detected crack is graded "minor"; at or
  # above, "major".
  minor_severity_max_length_px: 120

corner_detection:
  # Ratio of (tile contour area / its minimum-area bounding rectangle area).
  # A perfect rectangle is close to 1.0; a broken/chipped corner lowers this.
  # Derived from the 1st percentile of fill_ratio measured on 310 known-intact
  # tile photos (0.852), minus a small margin, so ordinary photography noise
  # doesn't false-positive "broken corner" on an intact tile.
  #
  # KNOWN GAP, FIXED 2026-08-11: fill_ratio alone under-catches diagonal/
  # triangular corner chips (the realistic way ceramic actually breaks) —
  # confirmed empirically that a chip whose two legs each reach halfway
  # across the tile's edge only drops fill_ratio to ~0.87, above this
  # threshold, so it would NOT have been flagged. See
  # max_missing_extent_fraction below, and corner_detection.py's docstring.
  min_fill_ratio: 0.83
  # How far (as a fraction of the tile's own side length) the deepest point
  # of a gap between the tile's actual shape and its ideal rectangle is
  # allowed to reach before it counts as a broken corner too, independent of
  # fill_ratio — this is what actually catches the diagonal-chip case above.
  # Derived from the max observed on 310 known-intact tile photos (0.186,
  # p99.5 was 0.159) plus a margin; a synthetic chip reaching halfway across
  # a tile's edge measures ~0.35, well above this.
  max_missing_extent_fraction: 0.22
  # Real-world tile size (inches) — these tiles are 9x9in. Used only to
  # convert missing_area_px/missing_depth_px into inches for reporting
  # (missing_area_sq_inches, missing_depth_inches on CornerResult); doesn't
  # affect the corner_broken decision itself, and needs no separate
  # calibration since it's derived from the tile's own detected pixel size
  # each time (see corner_detection.py).
  tile_size_inches: 9.0

tile_tracker:
  # Consecutive frames a tile must be detected/absent before counting it as
  # arrived/departed, to debounce single-frame segmentation noise.
  min_present_frames: 3
  min_absent_frames: 5

# Which event triggers "photograph this tile and grade it".
#
#   "line_crossing" - fire when the tile's bounding-box CENTRE crosses the
#                     trigger_line below. Right for a conveyor: every tile is
#                     photographed at the same point in the frame, so framing,
#                     scale and motion blur are consistent between tiles.
#   "departure"     - the original behaviour: fire when the tile has fully
#                     left the frame, grading the largest-area sighting seen
#                     while it was crossing. Kept because it needs no line to
#                     be positioned, which is useful on footage where the
#                     camera's mounting is not yet fixed.
#
# These grade DIFFERENT frames, so results on the same footage will differ.
processing_trigger: "line_crossing"

trigger_line:
  # Where the line sits, as a fraction of the frame (0.0-1.0), so one value
  # stays correct at any camera resolution. 0.5 is the middle pixel of the feed.
  # For a "vertical" line this is a fraction of the WIDTH (the line runs
  # top-to-bottom; tiles cross it travelling left/right); for "horizontal", a
  # fraction of the HEIGHT.
  position: 0.5
  # Which way the line runs:
  #   "auto"       - PERPENDICULAR TO THE BELT, whichever way the belt runs in the
  #                  frame. Read from the belt itself (segmentation.belt_roi), so
  #                  it is right for a portrait phone clip and a landscape webcam
  #                  alike. The first few frames of a source are used to learn it;
  #                  no tile can fire before that. REQUIRES belt_roi.mode to be
  #                  "color" or "fixed" (the station refuses to start otherwise).
  #   "vertical" / "horizontal" - force it. A belt running top-to-bottom in the
  #                  frame needs "horizontal"; a left-to-right belt needs
  #                  "vertical". The old default, "vertical", ran PARALLEL to the
  #                  belt on both sample recordings, so nothing ever crossed it.
  orientation: "auto"
  # How many frames with a readable belt must agree before "auto" commits.
  auto_frames: 8
  # Which way across the line counts. Set this to the conveyor's actual travel
  # so a tile nudged backwards is not graded twice. "forward" = the centre's
  # coordinate increasing (left->right, or top->bottom). "both" accepts either.
  direction: "both"
  # How far past the line (same 0-1 units) the centre must travel before the
  # crossing is committed. Without this, a tile sitting on the line jitters a
  # pixel either side between frames from segmentation noise and fires
  # repeatedly. 0.02 of a 640px frame is ~13px.
  hysteresis: 0.02
  # Largest believable movement of the tile's centre between two frames (same
  # 0-1 units). A bigger jump means the segmenter switched to a different tile
  # (two in frame, near-equal areas), so it is NOT a crossing: the remembered
  # side is dropped and nothing fires. Real belt travel is a few % per frame.
  # Measured on real footage: identity flips jump ~0.6. null disables.
  max_step: 0.15
  # Tile identity (region_tracker.py). Every tile in view is matched to the tile
  # seen in the previous frame by nearest centre, so each gets its own id and
  # its own crossing - two tiles in frame can no longer be mistaken for one.
  # match_distance: farthest a centre may move between frames and still be the
  #   same tile, in 0-1 frame units. Must exceed belt travel per frame and stay
  #   well below the gap between neighbouring tiles (~10x apart on the real
  #   clip). Re-derive on the rig once belt speed and frame rate are known.
  # max_missed_frames: how long a tile may go unseen before its id is dropped.
  match_distance: 0.15
  max_missed_frames: 3
  # Draw the line and the tile's centre point on the dashboard's video feed.
  # Display only - has no effect on detection.
  draw_overlay: true

# Optional ONNX tile-grade classifier. OFF by default: the station must work
# without onnxruntime installed, and this is a second opinion rather than a
# replacement for the crack/corner detectors.
#
# IMPORTANT - what this model does and does not do: it classifies the cosmetic
# grade tier (3A/3B/4/5) of an INTACT tile. It does NOT detect cracks or broken
# corners. The station's own decision stays the rule-based `grade` from
# crack/corner detection; the model's answer is recorded alongside it as
# `model_grade` so the two can be compared on real tiles. See
# camera_models/cam_edge/README.md for the accuracy it was measured at
# (82.9% on a 76-image val set, 95% CI 72.9-89.7 - i.e. do not treat a single
# prediction as authoritative).
grading_model:
  enabled: false
  # Relative to camera_node/. Staged by camera_models/cam_edge/stage_model.py,
  # which also writes the sidecar .json holding classes/preprocess/provenance -
  # those are read from there, so they need not be repeated here.
  path: "models/tile_grade_yolo26n_cls.onnx"
  # ONNX Runtime intra-op threads. Pinned low on purpose: the Pi has 4 cores
  # shared with the capture thread and the Flask server, and letting inference
  # take all of them starves the MJPEG stream.
  threads: 2
  # Uncomment to override the sidecar metadata (normally unnecessary):
  # classes: ["3A", "3B", "4", "5"]
  # preprocess: "yolo_cls"   # or "vit_hf" for a ViT export
  # input_size: 224

# The station's single grade (added 2026-10-10). Two things grade a tile: the
# crack/corner rules (measured defects -> Grade A / Grade B / Reject) and the
# model (cosmetic tier 3A / 3B / 4 / 5). They are blind to each other's
# defects, so they are put on ONE scale and combined as the WORSE of the two.
#   tier_map              model tier -> station grade. Every class the model can
#                         output must be listed or the station refuses to start.
#   model_min_confidence  the model only gets a vote at or above this. Below it
#                         the model abstains and the rules stand alone. On this
#                         rig the model scores ~30% on 4 classes (near chance),
#                         so at 0.6 it abstains almost every time until it is
#                         retrained on this camera. Lower it only with evidence.
# Ignored when grading_model.enabled is false (grade is then purely rule-based).
grading:
  tier_map:
    "3A": "Grade A"
    "3B": "Grade B"
    "4": "Grade C"
    "5": "Reject"
  model_min_confidence: 0.6

capture_snapshots:
  # When enabled, each tile's isolated photo is saved to disk on departure
  # (see camera/snapshot.py), named by its sequence number, so it can be
  # reviewed later instead of only living in memory for the process's
  # lifetime. output_dir is relative to the repo root; data/ is gitignored
  # (see .gitignore) so these never get committed.
  enabled: true
  output_dir: "data/camera_captures"

# Recording from the dashboard's Record button (added 2026-10-11). Raw, un-annotated
# frames are saved so a recording can be replayed through the whole pipeline later
# and give the result the live run would have. Each recording gets its own folder
# named by the date and time it started:
#   data/recordings/2026-10-11_14-30-05/{video.mp4, meta.json}
# data/ is gitignored, so recordings are never committed.
recording:
  output_dir: "data/recordings"      # relative to the repo root
  # The first few frames are used to MEASURE the camera's real frame rate before
  # the file is opened (a webcam asked for 15 fps often delivers 7-30). Writing
  # the wrong rate would make every replay play too fast or too slow.
  warmup_frames: 10
  fallback_fps: 15                   # only if the rate cannot be measured

dashboard:
  # 0.0.0.0 so the dashboard is reachable from other devices over WiFi, not
  # just localhost.
  host: "0.0.0.0"
  port: 5000
  jpeg_quality: 80
  # Width of the video the BROWSER receives (detection always runs on the full-size
  # frame). A 1920-wide frame JPEG-encoded 30 times a second is several MB/s - too
  # much for a typical WiFi link, which shows up as a stuttering, low-frame-rate feed.
  # null = send full size.
  stream_width: 960
  # Lets the page switch the video source, open files and start/stop recording.
  # Anyone who can reach the dashboard can use these, and it is served on the
  # network. Set false (or host: "127.0.0.1") on a station that should not be
  # re-pointed by whoever is on the WiFi. Files can only be opened from data/.
  controls_enabled: true
