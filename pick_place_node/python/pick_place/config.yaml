# Digital twin prototype configuration.
# All tunables live here so the code never hardcodes device/threshold values
# (see .claude/CLAUDE.md Development Rule 2).
#
# PLACEHOLDER: this drives MockGantrySimulator only — no real gantry hardware exists
# yet (documents/project/Pick_Place_Sorting_Subsystem.md §3.1). Workspace bounds and
# waypoint coordinates below are arbitrary placeholders, not real gantry travel limits
# — those are blocked on SMTW tile size/weight data (.claude/CLAUDE.md Known Technical
# Debt). Re-derive once real gantry dimensions are known.

# 'mock' = MockGantrySimulator; 'sim' = real protocol + job runner on a simulated MCU;
# 'bridge' = the real gantry MCU through the App Lab Bridge (what runs on the UNO Q);
# 'serial' = a pyserial port (not usable on the UNO Q: Serial there is the router monitor).
backend: mock

workspace:
  x_min_mm: 0
  x_max_mm: 600
  y_min_mm: 0
  y_max_mm: 400
  z_min_mm: 0
  z_max_mm: 200

# A simple home -> pick -> place -> home patrol the mock simulator loops through,
# so the digital twin has something to visibly do (moving, picking, placing,
# vacuum on/off) without any real motion-control code.
mock:
  travel_speed_mm_s: 150
  # Home position (also the travel height used between pick/place approaches).
  home: {x: 0, y: 0, z: 200}
  # The demo patrol runs pickup -> bin_2 so the picture matches the real layout
  # (`locations` / `stacks` below); it does not change stack counts.
  pick_xy: {x: 500, y: 100}
  pick_z_mm: 20
  place_xy: {x: 100, y: 250}
  place_z_mm: 20
  # How long to pause at pick/place/home before moving on, seconds.
  dwell_s: 0.6

# The tile being handled (owner, 2026-10-12: 3 1/4 in square, 12 mm thick, 300 g).
tile:
  size_mm: 82.55
  thickness_mm: 12.0
  weight_g: 300

# Visual-only props for the twin. Tile size/thickness mirror `tile:` above.
scene:
  tile_size_mm: 82.55
  tile_thickness_mm: 12
  pick_stack_count: 4

# ---- real gantry (batch 1, 2026-10-12) --------------------------------------
# PROVISIONAL: every position, height and speed below is a placeholder until the
# gantry frame is built and taught-in (Development Rule 3). The envelope is the
# `workspace:` block above (pushed to the MCU with SETENV).
gantry:
  # Z (cup-tip height, larger = higher) the cup travels at whenever X or Y changes.
  safe_z_mm: 200
  # A carried tile's underside must clear a full stack by at least this much at safe Z.
  safe_clearance_mm: 10
  feed_mm_min: {travel_xy: 8000, travel_z: 4000, approach_z: 2000, lift_z: 3000}
  speed:                       # pushed with SETSPEED
    x: {max_mm_min: 8000, accel_mm_s2: 400}
    y: {max_mm_min: 8000, accel_mm_s2: 400}
    z: {max_mm_min: 4000, accel_mm_s2: 300}
  # Closed loop (missed-step detection): encoder-vs-commanded deviation that
  # raises LOST_STEPS_<axis>, and Y-vs-A deviation that raises SKEW_Y.
  # Pushed with SETTOL. 1 mm / 0.5 mm are guesses, not measurements.
  tolerance_mm: {lost_steps: 1.0, skew: 0.5}
  link_timeout_ms: 500
  serial: {port: "/dev/ttyACM0", baud: 115200}   # re-verify on the board
  # RouterBridge link (backend: bridge): the g_poll cadence and how many failed polls in a row
  # mean the link is lost. Never run against the board.
  bridge: {poll_interval_s: 0.02, fail_limit: 5}
  # This node on the station bus (pick_place.gantry_station / twin_prototype
  # --station-host). The Pi runs the broker (station_coordination.md).
  station:
    host: "192.168.1.11"
    port: 1883
    client_id: "tile-gantry"
    status_interval_s: 2.0
    # pause / resume / acknowledge / reset_stack: never move the machine.
    commands_enabled: true
    # home / recover MOVE the gantry: off until someone has decided the master may do that.
    motion_commands_enabled: false
    # Run one HOME ALL as soon as the config has been pushed. Off: homing is an operator action.
    home_on_start: false

# Where tiles are TAKEN FROM. The Pi names the source (default `pickup`); the
# conveyor delivers every tile to this one fixed point. z = cup-tip height when
# it touches the top of a tile waiting there.
locations:
  pickup: {x: 500, y: 100, z: 20}

# Where tiles are KEPT. Four separate stacks; the names are what the Pi sends as
# `destination` (acoustic config.yaml station.bins: Grade A..C -> bin_1..bin_3,
# Reject -> bin_4). base_z_mm = cup-tip height when releasing the FIRST tile onto
# an empty stack; each tile in raises the next release by tile.thickness_mm.
stacks:
  bin_1: {label: "Grade A", x: 100, y: 100, base_z_mm: 20, max_height: 10}
  bin_2: {label: "Grade B", x: 100, y: 250, base_z_mm: 20, max_height: 10}
  bin_3: {label: "Grade C", x: 250, y: 100, base_z_mm: 20, max_height: 10}
  bin_4: {label: "Reject", x: 250, y: 250, base_z_mm: 20, max_height: 10}

dashboard:
  # 0.0.0.0 so the dashboard is reachable from other devices over WiFi, not just
  # localhost — same convention as camera_node/acoustic_node.
  host: "0.0.0.0"
  # Different from camera_node's 5000 so both can run at once during development.
  port: 5050
  # How often the browser polls /api/status for the live twin.
  poll_interval_s: 0.1
  # How often the background worker advances the simulator.
  tick_hz: 30
  # Jog step sizes offered as buttons in the twin's control panel, mm.
  jog_steps_mm: [1, 10, 50]
