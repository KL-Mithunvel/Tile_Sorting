[pytest]
# Node packages live under <node>/python/ (App Bricks layout — see
# acoustic_node/app.yaml). This puts each node's python/ dir on sys.path so
# `from acoustic.capture import ...` / `from camera.segmentation import ...`
# etc. keep working unchanged from tests/, without needing an editable
# install per node.
pythonpath =
    acoustic_node/python
    camera_node/python
